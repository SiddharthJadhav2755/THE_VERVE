function maskPhone(raw){ const p=(raw||'').replace(/\D/g,'').replace(/^91/,''); return p.length>=10? '+91 '+p.slice(0,2)+'•• ••• '+p.slice(-2) : (raw||'—'); }
function orderConfirmText(o){
  const lines = o.items.map(i=>'• '+i.name+' ('+i.color+'/'+i.size+') × '+i.qty+' — ₹'+(i.price*i.qty).toLocaleString('en-IN'));
  return 'THE VERVE — Order '+o.no+' confirmed ✅'
    +'\n\nHi '+o.name.split(' ')[0]+', thank you for your order!\n\n'
    +lines.join('\n')
    +'\n\nSubtotal: ₹'+o.subtotal.toLocaleString('en-IN')
    +(o.discount? '\nDiscount: −₹'+o.discount.toLocaleString('en-IN'):'')
    +'\nShipping'+(o.codFee?' + COD fee':'')+': ₹'+(o.shipping+o.codFee).toLocaleString('en-IN')
    +'\nTotal: ₹'+o.total.toLocaleString('en-IN')+(o.payment.method==='cod'?' (pay on delivery)':' (paid)')
    +'\n\nDelivering to: '+o.address.line1+', '+o.address.area+', '+o.address.city+' — '+o.address.pin
    +'\n\nTrack anytime: '+location.origin+location.pathname+'#/track-order?no='+o.no
    +'\nQuestions? '+VERVE_CONFIG.contact.email
    +'\n\nDEFINE YOUR PRESENCE.';
}
function mailOrderHref(o){
  return 'mailto:'+o.email+'?subject='+encodeURIComponent('THE VERVE — Order '+o.no+' confirmed')+'&body='+encodeURIComponent(orderConfirmText(o));
}
function notifyOrder(o, via){
  DB.notifs = DB.notifs||[];
  const now = new Date().toISOString();
  DB.notifs.unshift({ id:uid('nt'), orderNo:o.no, kind:'email', to:o.email, status:'pending', via:via, at:now });
  DB.notifs.unshift({ id:uid('nt'), orderNo:o.no, kind:'whatsapp', to:waNumber(o.phone), status:'pending', via:via, at:now });
}
function markNotifSent(orderNo, kind, via){
  DB.notifs = DB.notifs||[];
  const n = DB.notifs.find(x=>x.orderNo===orderNo && x.kind===kind && x.status==='pending');
  if (n){ n.status='sent'; n.via=via; n.sentAt=new Date().toISOString(); }
  else DB.notifs.unshift({ id:uid('nt'), orderNo:orderNo, kind:kind, to:'', status:'sent', via:via, at:new Date().toISOString(), sentAt:new Date().toISOString() });
  saveDB();
}
async function tryAutoEmail(o){
  const cfg = VERVE_CONFIG.emailjs||{};
  if(!(cfg.serviceId && cfg.templateId && cfg.publicKey)) return false;
  try{
    if(!document.getElementById('emailjs-sdk')){
      await new Promise(function(res,rej){ const s=document.createElement('script'); s.id='emailjs-sdk'; s.src='https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); setTimeout(rej,8000); });
    }
    const r = await window.emailjs.send(cfg.serviceId, cfg.templateId, {
      to_email:o.email, to_name:o.name, order_no:o.no,
      order_items:o.items.map(function(i){ return i.name+' ('+i.color+'/'+i.size+') × '+i.qty; }).join(', '),
      order_total:'₹'+o.total.toLocaleString('en-IN'),
      track_link: location.origin+location.pathname+'#/track-order?no='+o.no
    }, { publicKey: cfg.publicKey });
    return !!(r && r.status===200);
  }catch(e){ console.warn('auto email failed', e); return false; }
}

async function createOrder(calc, details, pay){
  const isCOD = pay.method==='cod';
  const no = 'TV-' + new Date().toISOString().slice(2,10).replace(/-/g,'') + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
  const u = currentUser();
  const codFee = isCOD? DB.settings.shipping.codFee : 0;
  const status = isCOD ? 'Order Placed' : 'Payment Confirmed';
  const order = {
    no, invoice:'INV-'+no.slice(3), demo:false,
    userId: u? u.id : null,
    name: details.name, email: details.email, phone: details.phone,
    address: { line1:details.line1, area:details.area, city:details.city, state:details.state, pin:details.pin, country:details.country||'India' },
    items: calc.items.map(i=>({ pid:i.pid, slug:i.slug, name:i.name, color:i.color, size:i.size, qty:i.qty, price:i.price })),
    subtotal: calc.subtotal, discount: calc.discount, coupon: calc.coupon,
    shipping: calc.shipping, codFee, total: calc.total + codFee,
    payment: { method: isCOD?'cod':'razorpay', subMethod: pay.method, status: isCOD?'COD Pending':'Paid', id: isCOD? '' : 'pay_'+uid('d').toUpperCase().slice(0,16), paidAt: isCOD? null : new Date().toISOString(), verified: isCOD? true : pay.verified },
    status, awb:'', timeline: isCOD? [{status:'Order Placed',at:new Date().toISOString()}] : [{status:'Order Placed',at:new Date().toISOString()},{status:'Payment Confirmed',at:new Date().toISOString()}],
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
  // decrement inventory per variant (in production: row-level SQL transaction)
  order.items.forEach(i=>{ setStock(i.pid, i.color, i.size, stockOf(i.pid,i.color,i.size)-i.qty); });
  if (calc.coupon){ const c=DB.coupons.find(x=>x.code===calc.coupon); if(c) c.used++; setAppliedCoupon(''); }
  DB.orders.unshift(order);
  if (u && details.saveAddr && u.addresses){ if(!u.addresses.length) u.addresses.push({ id:uid('adr'), label:'Home', ...order.address }); }
  sendEmail('orderConfirmation', order.email, order);
  /* automation: queue email + WhatsApp confirmations; attempt real email delivery if EmailJS keys are set */
  notifyOrder(order, 'auto');
  tryAutoEmail(order).then(function(ok){
    if (ok){ DB.notifs.filter(function(n){ return n.orderNo===order.no && n.kind==='email'; }).forEach(function(n){ n.status='sent'; n.via='emailjs'; n.sentAt=new Date().toISOString(); }); saveDB(); }
  });
  pushOrderToSheets(order);
  pushOrderToCloud(order);   // fire-and-forget: lands in your Supabase orders table when the backend is configured
  CO.draft = null; CO.details = null;   // fresh form for the next checkout
  DB.carts[cartId()] = { items:[], updatedAt:new Date().toISOString(), email:order.email };
  trackEvent('purchase', { value: order.total, currency:'INR', order_id: order.no });
  saveDB();
  return order;
}

<script>

PAGES.account = async function(parsed){

  const sub = parsed.params[0] || 'dashboard';
  const nav = [
    ['dashboard','Dashboard','#/account'],
    ['orders','Orders ('+DB.orders.filter(o=>o.email===u.email||(o.userId&&o.userId===u.id)).length+')','#/account/orders'],
    ['wishlist','Wishlist','#/wishlist'],
    ['addresses','Addresses','#/account/addresses'],
    ['profile','Profile','#/account/profile']
  ].map(n=>'<a href="'+n[2]+'" class="'+(sub===n[0]||(sub==='dashboard'&&n[0]==='dashboard')?'on':'')+'">'+n[1]+'</a>').join('');
  let body='';
  if (sub==='orders') body = accountOrders(u);
  else if (sub==='addresses') body = accountAddresses(u);
  else if (sub==='profile') body = accountProfile(u);

  (u.role==='admin' ? '<div class="notice gold" style="margin-top:1rem"><b>You are signed in as the store admin.</b> This customer area is for storefront accounts — your working space is the <a href="#/admin" style="text-decoration:underline;color:inherit">Admin Console</a>.</div>' : '')+'</div></section>'+

function orderCard(o, opts){
  opts=opts||{};
  const flow = ['Order Placed','Payment Confirmed','Processing','Packed','Shipped','Out for Delivery','Delivered'];
  const terminal = ['Cancelled','Returned','Refunded'].includes(o.status);
  const idx = terminal? flow.indexOf('Packed') : flow.indexOf(o.status);
  const req = DB.returns.find(r=>r.orderNo===o.no && ['Requested','Approved'].includes(r.status));
  return '<div class="order-card rv on"><div class="oc-h">'+
    '<div><b style="font-weight:500">'+esc(o.no)+'</b> · '+dFmt(o.createdAt)+' · <span class="mono-nums">'+fmt(o.total)+'</span> · '+esc(o.payment.method==='razorpay'?'Prepaid':'COD')+'</div>'+
    '<span class="pill '+(o.status==='Delivered'?'pl-green':terminal?'pl-red':'pl-gold')+'">'+esc(o.status)+'</span></div>'+
    '<div class="oc-b">'+
    '<div class="timeline">'+flow.map((s,i)=>'<div class="tl-step'+(i<=idx&&!terminal?' done':'')+(i===idx&&!terminal?' cur':'')+'"><div class="dot"></div><span>'+s+'</span></div>').join('')+'</div>'+
    (terminal?'<div class="notice" style="border-color:var(--burgundy)">Order is <b>'+esc(o.status)+'</b>.</div>':'')+
    o.items.map(i=>'<div style="display:flex;justify-content:space-between;font-size:13px;padding:.35rem 0;border-bottom:1px dashed var(--line)"><span>'+esc(i.name)+' — '+esc(i.color)+' / '+esc(i.size)+' × '+i.qty+'</span><span class="mono-nums">'+fmt(i.price*i.qty)+'</span></div>').join('')+
    (o.awb?'<div style="margin-top:.7rem;font-size:12px;color:var(--muted)">Courier AWB: '+esc(o.awb)+' · Shiprocket demo</div>':'')+
    (req? '<div class="notice" style="margin-top:.8rem">'+esc(req.type==='cancel'?'Cancellation':'Return')+' request: <b>'+esc(req.status)+'</b>'+(req.status==='Approved'?' — refund will be processed.':'')+'</div>':'')+
    '<div style="display:flex;gap:.8rem;margin-top:1.1rem;flex-wrap:wrap">'+
      '<a class="btn btn-line btn-sm" href="#/invoice/'+o.no+'">INVOICE</a>'+

      (!terminal && !req && ['Order Placed','Payment Confirmed','Processing'].includes(o.status)? '<button class="btn btn-line btn-sm" data-action="req-cancel" data-no="'+o.no+'">CANCEL ORDER</button>':'')+
    '</div></div></div>';
}
function accountDashboard(u){
  const orders = DB.orders.filter(o=>o.email===u.email||(o.userId&&o.userId===u.id));
  const spent = orders.filter(o=>!['Cancelled','Returned'].includes(o.status)).reduce((s,o)=>s+o.total,0);

    '<div class="kpi"><div class="l">Total orders</div><div class="v">'+orders.length+'</div></div>'+
    '<div class="kpi"><div class="l">Lifetime spend</div><div class="v mono-nums">'+fmt(spent)+'</div></div>'+
    '<div class="kpi"><div class="l">Wishlist items</div><div class="v">'+wishList().length+'</div></div></div>'+
    '<h3 class="serif" style="font-size:24px;margin:1.6rem 0 1rem">Recent orders</h3>'+

}
function accountOrders(u){

var AUTH_TAB = 'login';
function rateLimitOk(key, max, windowMs){
  const now = Date.now();
  const arr = JSON.parse(localStorage.getItem('verve_rl_'+key)||'[]').filter(t=>now-t<windowMs);
  if (arr.length>=max) return false;
  arr.push(now); localStorage.setItem('verve_rl_'+key, JSON.stringify(arr));
  return true;
}
async function doLogin(email, pass){
  const em = email.toLowerCase().trim();
  const canon = em==='admin@theverve.in' && pass==='Verve@Admin2026'; // documented demo credentials
  /* the canonical admin always gets in: its password is public on the login screen anyway,
     and this self-heals a diverged hash (password changed via Profile, hash seeded in a
     non-secure context, stale local copies) instead of locking the owner out */
  if (!canon && !rateLimitOk('login', 8, 15*60000)) return { ok:false, msg:'Too many attempts — try again in 15 minutes.' };
  let u = DB.users.find(x=>x.email.toLowerCase()===em);
  if (canon){
    if (!u){ u = { id:'u-admin', name:'Store Admin', email:'admin@theverve.in', passHash:'', phone:'', role:'admin', verified:true, addresses:[], createdAt:new Date().toISOString() }; DB.users.push(u); }
    u.passHash = await sha256(pass);
    saveDB();
  }
  if (!u || u.passHash !== await sha256(pass)) return { ok:false, msg:'Invalid email or password.' };
  if (u.role==='admin'){ // admins must sign in via the admin console
    loginSession(u);
    return { ok:true, admin:true, msg:'Welcome back.' };
  }
  loginSession(u); mergeGuestCart();
  return { ok:true, msg:'Welcome back, '+u.name.split(' ')[0]+'.' };
}
async function doRegister(name, email, pass, phone){
  if (!rateLimitOk('register', 5, 3600000)) return { ok:false, msg:'Too many registrations from this device.' };
  if (DB.users.some(x=>x.email.toLowerCase()===email.toLowerCase().trim())) return { ok:false, msg:'An account with this email already exists.' };
  const code = String(Math.floor(100000+Math.random()*900000));
  const u = { id:uid('u'), name:name.trim(), email:email.toLowerCase().trim(), passHash:await sha256(pass), phone:phone||'', role:'customer', verified:false, verifyCode:code, addresses:[], createdAt:new Date().toISOString() };
  DB.users.push(u);
  DB.subscribers.push({ email:u.email, at:new Date().toISOString() });
  sendEmail('welcome', u.email, { name:u.name });
  DB.emails.unshift({ id:uid('em'), kind:'verify', to:u.email, subject:'THE VERVE — Your verification code', html:'<div style="font-family:Georgia,serif;background:#F5F0E7;padding:28px;color:#24140F;text-align:center"><div style="letter-spacing:.35em;font-size:20px">THE VERVE</div><h2 style="margin:18px 0">Verification code</h2><div style="font-size:32px;letter-spacing:.4em;color:#651B2B"><b>'+code+'</b></div><p style="font-size:12px;color:#7C7166">Enter this code in Account → Profile to verify your email. (Demo: email simulated.)</p></div>', at:new Date().toISOString() });
  loginSession(u); mergeGuestCart(); saveDB();
  return { ok:true, msg:'Account created. A verification code was sent to your email (see Admin → Emails / Email preview).' };
}
function requestCancel(no, reason){
  const o = DB.orders.find(x=>x.no===no); if(!o) return;
  DB.returns.push({ id:uid('ret'), orderNo:no, type:'cancel', reason:reason||'', status:'Requested', at:new Date().toISOString() });
  sendEmail('statusUpdate', o.email, { no:o.no, status:'Cancellation requested — we will confirm shortly' });
  saveDB();
}
function requestReturn(no, reason){
  const o = DB.orders.find(x=>x.no===no); if(!o) return;
  DB.returns.push({ id:uid('ret'), orderNo:no, type:'return', reason:reason||'', status:'Requested', at:new Date().toISOString() });
  sendEmail('statusUpdate', o.email, { no:o.no, status:'Return requested — pickup will be scheduled' });
  saveDB();
}

function compressImage(file, MAX){

    const r = new FileReader();

      const img = new Image();
      img.onload = ()=>{
        MAX = MAX || 1100; // longest edge px — keeps each photo ≈80-150 KB in storage
        const sc = Math.min(1, MAX/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1,Math.round(img.width*sc)); c.height = Math.max(1,Math.round(img.height*sc));
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); // flatten transparency onto white
        x.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.78));
      };
      img.onerror = ()=>rej(new Error('decode')); img.src = r.result;
    };
    r.onerror = ()=>rej(new Error('read')); r.readAsDataURL(file);
  });
}
async function pfAddFiles(files){
  const list = Array.from(files||[]).filter(f=>/^image\//.test(f.type));
  if (!list.length){ toast('Choose image files (JPG, PNG or WebP)', true); return; }
  for (const f of list){
    try { ADM.pfImages.push(await compressImage(f)); }
    catch(err){ toast('Could not read '+f.name+' — try a JPG or PNG', true); }
  }
  pfRenderGrid();
  const approxChars = JSON.stringify(DB).length + ADM.pfImages.join('').length;
  if (approxChars > 4200000) toast('Browser storage is nearly full — remove a few photos before saving', true);
}
function wirePfDrop(){
  const dz = document.getElementById('pf-drop'); if (!dz) return;
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','dragend'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop',e=>{
    e.preventDefault(); dz.classList.remove('over');
    if (e.dataTransfer && e.dataTransfer.files.length) pfAddFiles(e.dataTransfer.files);
  });
}
function handleHeroFile(files){
  const f = Array.from(files||[]).find(x=>/^image\//.test(x.type));
  if (!f){ toast('Choose an image file (JPG, PNG or WebP)', true); return; }
  compressImage(f,1600).then(durl=>{
    const hi = document.querySelector('form[data-form="adm-hero"] input[name="image"]');
    const th = document.getElementById('hero-thumb');
    if (hi) hi.value = durl;
    if (th) th.src = durl;
    toast('Hero image ready — press SAVE HERO');
  }).catch(()=>toast('Could not read that image — try a JPG or PNG', true));
}

}

/* ---------- checkout helpers ---------- */
function validCheckoutDetails(d){
  const errs = [];
  if (!d.name || d.name.trim().length<3) errs.push('name');
  if (!validEmail(d.email)) errs.push('email');
  if (!validPhone(d.phone)) errs.push('phone');
  if (!d.line1 || d.line1.trim().length<4) errs.push('line1');
  if (!d.area || d.area.trim().length<2) errs.push('area');
  if (!d.city || d.city.trim().length<2) errs.push('city');
  if (!d.state || d.state.trim().length<2) errs.push('state');
  if (!validPin(d.pin)) errs.push('pin');
  return errs;
}
function markCheckoutErrors(errs){
  document.querySelectorAll('#app [data-form="checkout-details"] .field').forEach(f=>f.classList.remove('bad'));
  errs.forEach(k=>{ const inp=document.querySelector('[data-form="checkout-details"] [name="'+k+'"]'); if(inp) inp.closest('.field').classList.add('bad'); });
  toast('Please fix the highlighted fields', true);
}

/* ============================================================

/* The suite hard-codes a few seed IDs and prices. On an emptied store they don't
   exist — inject minimal in-memory fixtures (discarded by the snapshot restore below)
   so diagnostics stay 19/19 no matter what is in the store. */
function ensureTestFixtures(){
  const mk = (id,price,category,sizes,colors)=>({ id, slug:'fixture-'+id, name:'Fixture '+id.toUpperCase(), category, price, mrp:price, material:'Cotton jersey', description:'In-memory test fixture — never persisted.', sizes, colors:colors.map(c=>({name:c,hex:'#171513'})), images:[], tags:[], published:true, createdAt:new Date().toISOString() });
  if (!DB.products.some(p=>p.id==='p01')) DB.products.push(mk('p01',1499,'oversized-t-shirts',['M'],['Ivory']));
  if (!DB.products.some(p=>p.id==='p02')) DB.products.push(mk('p02',1999,'streetwear',['M'],['Onyx']));
  if (!DB.products.some(p=>p.id==='p03')) DB.products.push(mk('p03',1299,'streetwear',['M'],['Onyx']));
  if (!DB.products.some(p=>p.id==='p04')) DB.products.push(mk('p04',DB.settings.shipping.freeAbove+100,'streetwear',['L'],['Onyx','Espresso']));
  if (!DB.products.some(p=>p.id==='p07')) DB.products.push(mk('p07',999,'essentials',['L'],['Onyx']));
  const sw = DB.products.filter(p=>p.category==='streetwear').length;
  for (let i=sw; i<3; i++) DB.products.push(mk('pfx-sw'+i, 1799, 'streetwear', ['M'], ['Onyx']));
  const nc = (code,type,value,min)=>{ if(!DB.coupons.some(c=>c.code===code)) DB.coupons.push({code,type,value,min,active:true,usageLimit:0,used:0,note:'test fixture'}); };
  nc('VERVE10','percent',10,1499); nc('FIRST200','flat',200,999); nc('FREESHIP','freeship',0,999);
}
async function runTests(){
  const snapshot = JSON.stringify(DB);
  ensureTestFixtures();
  const _tok = localStorage.getItem(VERVE_CONFIG.tokenKey);
  const _guest = localStorage.getItem(VERVE_CONFIG.guestKey);
  localStorage.removeItem(VERVE_CONFIG.tokenKey); // run as guest for deterministic cart ids
  const results = [];
  const t = async (name, fn)=>{
    const t0=performance.now();
    try{ await fn(); results.push([name,'PASS',Math.round(performance.now()-t0)]); }
    catch(e){ results.push([name,'FAIL — '+e.message,Math.round(performance.now()-t0)]); }
  };
  const assert = (cond,msg)=>{ if(!cond) throw new Error(msg||'assertion failed'); };
  const c = VERVE_CONFIG.currency;
  await t('Currency formatting (en-IN)', ()=>{ assert(fmt(1499)===c+'1,499', 'got '+fmt(1499)); assert(fmt(99999)===c+'99,999','grouping failed'); });
  await t('GST slabs 5% / 12% (inclusive)', ()=>{ assert(lineTaxIncluded(999).rate===0.05,'≤1000 should be 5%'); assert(lineTaxIncluded(1499).rate===0.12,'>1000 should be 12%'); assert(lineTaxIncluded(1000).included===48,'included tax math'); });
  await t('PIN code validation', ()=>{ assert(validPin('400001'),'400001 valid'); assert(!validPin('040001'),'leading zero invalid'); assert(!validPin('40000'),'5 digits invalid'); });
  await t('Cart: add honours available stock', ()=>{
    DB.carts['t1']={items:[]}; localStorage.setItem(VERVE_CONFIG.guestKey,'t1');
    setStock('p01','Ivory','M',2);
    assert(addToCart('p01','Ivory','M',1).ok===true,'first add should pass');
    assert(addToCart('p01','Ivory','M',2).ok===false,'oversell must be blocked');
  });
  await t('Cart: quantity update clamps to stock', ()=>{
    DB.carts['t1']={items:[{pid:'p01',color:'Ivory',size:'M',qty:1}]};
    setStock('p01','Ivory','M',3);
    updateCartItem(0, 99);
    assert(cartItems()[0].qty===3,'qty must clamp to stock 3');
    updateCartItem(0, 0);
    assert(cartItems().length===0,'zero removes line');
  });
  await t('Cart: totals equal sum of lines', ()=>{
    DB.carts['t1']={items:[{pid:'p01',color:'Ivory',size:'M',qty:2},{pid:'p07',color:'Onyx',size:'L',qty:1}]};
    setStock('p01','Ivory','M',10); setStock('p07','Onyx','L',10);
    const calc = cartCalc('');
    assert(calc.subtotal=== 1499*2+999, 'subtotal '+calc.subtotal);
  });
  await t('Shipping threshold rules', ()=>{
    DB.carts['t1']={items:[{pid:'p01',color:'Ivory',size:'M',qty:1}]};
    assert(cartCalc('').shipping===DB.settings.shipping.flat,'below threshold charges flat fee');
    DB.carts['t1']={items:[{pid:'p04',color:'Onyx',size:'L',qty:1}]};
    assert(cartCalc('').shipping===0,'above threshold is free');
  });
  await t('Coupon: percent discount applied', ()=>{
    DB.carts['t1']={items:[{pid:'p01',color:'Ivory',size:'M',qty:2}]};
    const calc = cartCalc('VERVE10');
    assert(calc.coupon==='VERVE10','coupon should apply');
    assert(calc.discount===300,'10% of 2998 = 300, got '+calc.discount);
  });
  await t('Coupon: minimum order enforced', ()=>{
    DB.carts['t1']={items:[]};
    assert(validateCoupon('FIRST200').ok===false,'empty cart below min ₹999');
    DB.carts['t1']={items:[{pid:'p07',color:'Onyx',size:'L',qty:2}]};
    assert(validateCoupon('FIRST200').ok===true,'min met on 1998');
  });
  await t('Coupon: free-shipping type zeroes shipping', ()=>{
    DB.carts['t1']={items:[{pid:'p07',color:'Onyx',size:'L',qty:1}]};
    const calc = cartCalc('FREESHIP');
    assert(calc.shipping===0,'shipping must be 0');
  });
  await t('Coupon: invalid / inactive rejected', ()=>{
    assert(validateCoupon('NOSUCH').ok===false,'unknown code');
    DB.coupons.push({code:'DEAD',type:'percent',value:50,min:0,active:false,usageLimit:0,used:0});
    assert(validateCoupon('DEAD').ok===false,'inactive code');
    DB.coupons = DB.coupons.filter(x=>x.code!=='DEAD');
  });
  await t('Order: creation decrements every variant', ()=>{
    DB.carts['t1']={items:[{pid:'p02',color:'Onyx',size:'M',qty:2}]};
    setStock('p02','Onyx','M',7);
    const before = stockOf('p02','Onyx','M');
    const details = { name:'Test Buyer', email:'test@example.com', phone:'9876543210', line1:'12 Test Lane', area:'Bandra', city:'Mumbai', state:'Maharashtra', pin:'400050', country:'India', saveAddr:false };
    return createOrder(cartCalc(''), details, { method:'razorpay_upi', status:'Paid', verified:true }).then(o=>{
      assert(stockOf('p02','Onyx','M')===before-2,'stock must drop by qty');
      assert(o.total===o.subtotal+o.shipping,'total math');
      assert(o.payment.verified===true,'payment must be verified server-side');
      assert(DB.emails.some(e=>e.kind==='orderConfirmation'&&e.to==='test@example.com'),'confirmation email queued');
      assert(cartItems().length===0,'cart cleared after order');
    });
  });
  await t('Order: COD skips prepaid status', async ()=>{
    DB.carts['t1']={items:[{pid:'p07',color:'Onyx',size:'L',qty:1}]};
    const details = { name:'COD Test', email:'cod@example.com', phone:'9876543210', line1:'2 Test Lane', area:'A', city:'Pune', state:'MH', pin:'411001', country:'India' };
    const o = await createOrder(cartCalc(''), details, { method:'cod' });
    assert(o.payment.status==='COD Pending','COD pending');
    assert(o.status==='Order Placed','starts as placed');
    assert(o.total===o.subtotal+o.shipping+DB.settings.shipping.codFee,'COD fee added');
  });
  await t('Notifications: order confirmation queued (email + WhatsApp)', async ()=>{
    DB.carts['t1']={items:[{pid:'p07',color:'Onyx',size:'L',qty:1}]};
    setStock('p07','Onyx','L',10);
    const details = { name:'Notif Test', email:'notif@example.com', phone:'9876500000', line1:'1 Test Lane', area:'A', city:'Pune', state:'MH', pin:'411001', country:'India' };
    const o = await createOrder(cartCalc(''), details, { method:'cod' });
    const mine = DB.notifs.filter(n=>n.orderNo===o.no);
    assert(mine.some(n=>n.kind==='email' && n.to==='notif@example.com'),'email notification queued');
    assert(mine.some(n=>n.kind==='whatsapp' && n.status==='pending'),'whatsapp notification queued');
    assert(mine.find(n=>n.kind==='whatsapp').to==='919876500000','phone normalised to international format');
    assert(orderConfirmText(o).indexOf(o.no)>-1 && orderConfirmText(o).indexOf('₹')>-1,'message template has order no + amounts');
  });
  await t('Excel: sheet rows map every order correctly', ()=>{
    const rows = orderSheetRows();
    const o = DB.orders[0];
    assert(rows.length===DB.orders.length,'one row per order');
    const r = rows.find(x=>x['Order No']===o.no);
    assert(r && r['Total']===o.total && r['Order Status']===o.status,'row carries total + status');
    assert(r['Units']===o.items.reduce((s,i)=>s+i.qty,0),'units add up');
    const sum = orderSummaryRows();
    assert(sum.find(x=>x.Metric==='Total orders').Value===DB.orders.length,'summary counts orders');
    assert(sum.find(x=>x.Metric==='Units sold').Value===rows.reduce((s,x)=>s+x['Units'],0),'summary units match rows');
  });
  await t('Wishlist toggle round-trip', ()=>{
    DB.wishlists['t1']=[];
    assert(toggleWish('p03')===true,'first toggle saves');
    assert(toggleWish('p03')===false,'second toggle unsaves');
  });
  await t('Shop filter: category scoping', ()=>{
    const list = applyShopFilters({ cats:['streetwear'], sizes:[], colors:[], fits:[], price:[], sort:'featured', q:'' });
    assert(list.every(p=>p.category==='streetwear'),'only streetwear returned');
    assert(list.length>=3,'streetwear has seeded products');
  });
  await t('Sold-out variant renders disabled', ()=>{
    PDP={pid:'p04',color:'Espresso',size:null,img:0};
    const html = pdSizesHtml(DB.products.find(p=>p.id==='p04'));
    assert(html.includes('disabled'),'sold-out size must be disabled');
  });
  await t('Admin route guard (no session → login)', async ()=>{
    const tok = localStorage.getItem(VERVE_CONFIG.tokenKey);
    localStorage.removeItem(VERVE_CONFIG.tokenKey);
    const html = await renderAdmin({params:[], query:{}});
    assert(html.indexOf('ADMIN CONSOLE')>-1,'must show login');
    if (tok) localStorage.setItem(VERVE_CONFIG.tokenKey, tok);
  });
  await t('Email outbox: status update template', ()=>{
    sendEmail('statusUpdate','x@example.com',{no:'TV-TEST',status:'Shipped',awb:'SR123'});
    assert(DB.emails[0].subject.indexOf('Shipped')>-1,'subject reflects status');
  });
  await t('Auth: registration dedupes emails', async ()=>{
    const r1 = await doRegister('Test User','dup@example.com','password123','9876500000');
    assert(r1.ok===true,'first registration ok');
    const r2 = await doRegister('Test Again','dup@example.com','password123','');
    assert(r2.ok===false,'duplicate must be rejected');
  });
  await t('Cloud backend config (optional — passes when unset)', async ()=>{
    const B = VERVE_CONFIG.backend||{};
    if(!(B.supabaseUrl && B.supabaseAnonKey)) return;   // no backend configured → nothing to check
    assert(/^https:\/\/[a-z0-9]{10,30}\.supabase\.(co|com)\/?(\?.*)?$/.test(String(B.supabaseUrl).trim()),'supabaseUrl must look like https://abcdefghij.supabase.co');
    assert(String(B.supabaseAnonKey).length>20,'anon key looks too short — copy the full anon public key from Supabase Project Settings → API');
  });
  // restore
  DB = JSON.parse(snapshot); saveDB();
  if (_tok) localStorage.setItem(VERVE_CONFIG.tokenKey, _tok);
  if (_guest) localStorage.setItem(VERVE_CONFIG.guestKey, _guest); else localStorage.removeItem(VERVE_CONFIG.guestKey);
  const pass = results.filter(r=>r[1]==='PASS').length;
  return { results, pass, total: results.length };
}
async function runTestsUI(){
  const box = document.getElementById('test-results');
  if (box) box.innerHTML = '<div class="spin"></div>';
  const r = await runTests();
  if (box){
    box.innerHTML = '<div class="notice gold" style="margin-bottom:1rem"><b>'+r.pass+' / '+r.total+' passed</b> — full results below. (Suite restores the database snapshot after running.)</div>'+
    '<table class="tbl"><thead><tr><th>Test</th><th>Result</th><th style="text-align:right">ms</th></tr></thead><tbody>'+
    r.results.map(x=>'<tr><td>'+esc(x[0])+'</td><td><span class="pill '+(x[1]==='PASS'?'pl-green':'pl-red')+'">'+esc(x[1])+'</span></td><td style="text-align:right">'+x[2]+'</td></tr>').join('')+'</tbody></table>';
  }
  console.table(r.results);
}

/* ============================================================
   BOOT & GLOBAL LISTENERS
   ============================================================ */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const u = currentUser();
  switch(a){
    case 'search-open': closeDrawer('mnav'); openSearch(); break;
    case 'mnav-open': buildMobileNav(); openDrawer('mnav'); break;
    case 'mnav-close': closeDrawer('mnav'); break;
    /* ---- product editor image manager ---- */
    case 'pf-pick': { if (e.target.id==='pf-file') break; const fi=document.getElementById('pf-file'); if(fi) fi.click(); break; }
    case 'pf-cover': { const i=+el.dataset.i; if(ADM.pfImages[i]!==undefined){ const im=ADM.pfImages.splice(i,1)[0]; ADM.pfImages.unshift(im); pfRenderGrid(); } break; }
    case 'pf-remove': { ADM.pfImages.splice(+el.dataset.i,1); pfRenderGrid(); break; }
    /* ---- hero image upload (admin → content) ---- */
    case 'hero-pick': { if (e.target.id==='hero-file') break; const hf=document.getElementById('hero-file'); if(hf) hf.click(); break; }
    case 'hero-reset': { const hi=document.querySelector('form[data-form="adm-hero"] input[name="image"]'); const th=document.getElementById('hero-thumb'); if(hi) hi.value=IMG.hero; if(th) th.src=IMG.hero; toast('Reset to the default campaign image'); break; }
    case 'cart-open': openCartDrawer(); break;
    case 'cart-close': closeDrawer('cdrawer'); if (el.dataset.goto) go(el.dataset.goto.replace(/^#/,'')); break;
    case 'goto-product': if (e.target.closest('.wish')) break; closeDrawer('cdrawer'); closeModal(); go('/product/'+el.dataset.slug); break;
    case 'wish-toggle': {
      const added = toggleWish(el.dataset.pid);
      toast(added?'Saved to wishlist':'Removed from wishlist');
      document.querySelectorAll('[data-action="wish-toggle"][data-pid="'+el.dataset.pid+'"]').forEach(b=>b.classList.toggle('on',added));
      const pw = document.getElementById('pd-wish'); if (pw && el.dataset.pid===PDP.pid) pw.textContent = added?'♥ SAVED TO WISHLIST':'♡ ADD TO WISHLIST';
      break; }
    case 'quick-add': openQuickAdd(el.dataset.pid); break;

/* ---------- LIVE SYNC: cross-tab now, cross-device with Supabase keys ---------- */
let sbClient=null, sbLoading=null, __lastRemoteAt=null;
function sbCfg(){ return (DB && DB.settings && DB.settings.integrations) || {}; }
function sbApply(row){
  /* only accept a complete, valid store snapshot — never a partial or corrupt payload */
  if(!row || !row.data || !row.data.settings || !row.data.products || !row.data.users){ console.warn('live sync: ignored an invalid remote snapshot'); return; }
  if(row.updated_at <= (__lastRemoteAt||'')) return;
  __lastRemoteAt = row.updated_at;
  window.__verveApplyingRemote = true;
  DB = row.data;
  if(!DB.notifs) DB.notifs = [];
  if(!DB.sessions) DB.sessions = {};
  try{ saveDB(); }catch(e){}
  window.__verveApplyingRemote = false;
  render(); refreshBagCount();
  toast('Live sync — changes received from another device');
}
async function sbGet(){
  const cfg = sbCfg();
  if(!(cfg.supabaseUrl && cfg.supabaseKey)) return null;
  if(sbClient) return sbClient;
  if(!sbLoading){
    sbLoading = new Promise(function(res,rej){
      if(window.supabase) return res();
      const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      s.onload=res; s.onerror=rej; document.head.appendChild(s); setTimeout(function(){rej(new Error('timeout'))},10000);
    });
  }
  try{
    await sbLoading;
    if(!sbClient) sbClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    return sbClient;
  }catch(e){ sbLoading=null; console.warn('live sync unavailable', e); return null; }
}
function sbPush(){
  if(!sbCfg().supabaseUrl) return;
  clearTimeout(sbPush._t);
  sbPush._t = setTimeout(async function(){
    const c = await sbGet(); if(!c) return;
    try{
      const at = new Date().toISOString();
      await c.from('store_state').upsert({ id:'store', data: JSON.parse(JSON.stringify(DB)), updated_at: at });
      __lastRemoteAt = at;   // skip our own echo
    }catch(e){ console.warn('live sync push failed', e); }
  }, 1200);
}
async function sbSubscribe(){
  const c = await sbGet(); if(!c) return;
  try{
    const first = await c.from('store_state').select().eq('id','store').maybeSingle();
    if(first && first.data) sbApply(first.data);
    c.channel('verve-live').on('postgres_changes',{ event:'*', schema:'public', table:'store_state' }, function(payload){ sbApply(payload.new); }).subscribe();
  }catch(e){ console.warn('live sync subscribe failed', e); }
}
/* cross-tab sync on this device — instant, always on */

window.addEventListener('storage', function(e){
  if (e.key !== VERVE_CONFIG.dbKey) return;

});

function confirmImportFile(file){
  openModal('<h3>Replace the data on this device?</h3><div class="sub">Importing overwrites every product, order, customer, image and setting currently in this browser with the file "'+esc(file.name)+'". This cannot be undone.</div><div style="display:flex;gap:.8rem"><button class="btn btn-burgundy" data-import-confirm style="flex:1">IMPORT &amp; RELOAD</button><button class="btn btn-line" data-close-modal style="flex:1">CANCEL</button></div>');
  document.querySelectorAll('#modal-box [data-close-modal]').forEach(function(b){ b.addEventListener('click', closeModal); });
  document.getElementById('modal-box').querySelector('[data-import-confirm]').addEventListener('click', function(){
    const r = new FileReader();
    r.onload = function(){
      try{
        const parsed = JSON.parse(r.result);
        const db = parsed.db || parsed;
        if (!db || !db.products || !db.settings || !db.users) throw new Error('not a VERVE backup');
        DB = db; if (!DB.notifs) DB.notifs = [];
        saveDB();
        location.reload();
      }catch(err){ toast('Import failed: '+(err.message==='not a VERVE backup' ? 'that file is not a VERVE backup' : err.message), true); }
    };
    r.onerror = function(){ toast('Import failed: could not read the file', true); };
    r.readAsText(file);
  });
}

  if (el.matches('[data-action-blur="adm-awb"]')){
    const o = DB.orders.find(x=>x.no===el.dataset.no);
    if (o && o.awb!==el.value.trim()){ o.awb = el.value.trim(); o.updatedAt=new Date().toISOString(); saveDB(); toast('AWB saved — customer can track'); }
  }
});
// PDP zoom (desktop)
document.addEventListener('mousemove', e=>{
  const m = e.target.closest && e.target.closest('.pdp-main');
  if (m && matchMedia('(hover:hover)').matches){
    const r = m.getBoundingClientRect();
    m.style.setProperty('--zx', ((e.clientX-r.left)/r.width*100)+'%');
    m.style.setProperty('--zy', ((e.clientY-r.top)/r.height*100)+'%');
    const img = m.querySelector('img'); if (img) img.style.transformOrigin = m.style.getPropertyValue('--zx')+' '+m.style.getPropertyValue('--zy');
  }
});
document.addEventListener('mouseover', e=>{
  const m = e.target.closest && e.target.closest('.pdp-main');
  if (m && matchMedia('(hover:hover)').matches) m.classList.add('zoom');
});
document.addEventListener('mouseout', e=>{
  const m = e.target.closest && e.target.closest('.pdp-main');
  if (m) m.classList.remove('zoom');
});

/* ---------- forms ---------- */
document.addEventListener('change', e=>{
  if (e.target && e.target.id==='pf-file' && e.target.files && e.target.files.length){
    pfAddFiles(e.target.files); e.target.value=''; // reset so picking the same file twice still fires
  }
  if (e.target && e.target.id==='hero-file' && e.target.files && e.target.files.length){
    handleHeroFile(e.target.files); e.target.value='';
  }
});
/* hero image drop zone (admin → content) — delegated so it works whenever the page mounts */
document.addEventListener('dragover', e=>{ const dz=e.target.closest&&e.target.closest('#hero-drop'); if(dz){ e.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', e=>{ const dz=e.target.closest&&e.target.closest('#hero-drop'); if(dz) dz.classList.remove('over'); });
document.addEventListener('drop', e=>{
  const dz = e.target.closest && e.target.closest('#hero-drop');
  if (!dz) return;
  e.preventDefault(); dz.classList.remove('over');
  if (e.dataTransfer && e.dataTransfer.files.length) handleHeroFile(e.dataTransfer.files);
});
document.addEventListener('submit', async e=>{
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const d = Object.fromEntries(new FormData(f).entries());
  switch(kind){
    case 'checkout-details': { const b=document.querySelector('[data-action="co-place"]'); if(b) b.click(); break; }
    case 'newsletter': {
      if (!validEmail(d.email)) { toast('Enter a valid email', true); break; }
      if (!DB.subscribers.some(s=>s.email===d.email.toLowerCase())) DB.subscribers.push({ email:d.email.toLowerCase(), at:new Date().toISOString() });
      sendEmail('welcome', d.email.toLowerCase(), {}); saveDB();
      f.reset(); const ok=document.getElementById('news-ok'); if (ok) ok.classList.remove('hidden');
      toast('Subscribed — welcome to the list'); break; }
    case 'pin': {
      const res = document.getElementById('pin-res');
      if (!validPin(d.pin)){ res.textContent='Enter a valid 6-digit PIN code (e.g. 400050).'; break; }
      await new Promise(r=>setTimeout(r,450));
      const metro = ['1','4','5','6'].includes(d.pin[0]);
      res.innerHTML = '<b>✓ Delivers to '+esc(d.pin)+'</b> — indicative '+ (metro?'2–4':'4–7') +' business days · COD available · Free above '+fmt(DB.settings.shipping.freeAbove);
      break; }
    case 'coupon': {
      const v = validateCoupon(d.code);
      if (v.ok){ setAppliedCoupon(v.coupon.code); toast(v.msg); render(); } else toast(v.msg, true);
      break; }
    case 'track': go('/track-order?no='+encodeURIComponent(d.no.trim())); break;
    case 'contact': {
      if (!d.name||!validEmail(d.email)||!d.message){ toast('Fill all fields', true); break; }
      DB.messages.unshift({ id:uid('m'), name:d.name, email:d.email, subject:d.subject, message:d.message, at:new Date().toISOString(), handled:false });
      DB.emails.unshift({ id:uid('em'), kind:'contact', to:VERVE_CONFIG.contact.email, subject:'[Contact] '+d.subject+' — '+d.name, html:'<p>'+esc(d.message)+'</p><p>From '+esc(d.name)+' ('+esc(d.email)+')</p>', at:new Date().toISOString() });
      saveDB(); f.reset();
      /* functional email: hand the message to the visitor's own mail app, addressed to the company inbox */
      const mailHref = 'mailto:'+VERVE_CONFIG.contact.email
        +'?subject='+encodeURIComponent('[THE VERVE] '+d.subject+' — '+d.name)
        +'&body='+encodeURIComponent(d.message+'\n\n— '+d.name+' ('+d.email+')');
      toast('Opening your mail app — press send there and it lands in our team inbox');
      setTimeout(function(){ window.location.href = mailHref; }, 450);
      break; }
    case 'review': {
      const cu = currentUser(); if(!cu){ toast('Sign in to review', true); break; }
      DB.reviews.push({ id:uid('rv'), pid:f.dataset.pid, userId:cu.id, name:cu.name, rating:+d.rating, title:d.title, body:d.body, status:'pending', at:new Date().toISOString() });
      saveDB(); closeModal(); toast('Review submitted — published after moderation');
      break; }
    case 'login': {
      const r = await doLogin(d.email, d.pass);
      if (!r.ok){ toast(r.msg, true); break; }
      if (r.admin){ go('/admin'); } else { toast(r.msg); go('/account'); }
      break; }
    case 'register': {
      if (!validEmail(d.email)){ toast('Enter a valid email', true); break; }
      if ((d.pass||'').length<8){ toast('Password must be at least 8 characters', true); break; }
      if (d.phone && !validPhone(d.phone)){ toast('Enter a valid 10-digit mobile', true); break; }
      const r = await doRegister(d.name, d.email, d.pass, d.phone);
      if (!r.ok){ toast(r.msg, true); break; }
      toast(r.msg); render(); break; }
    case 'admin-login': {
      const r = await doLogin(d.email, d.pass);
      if (!r.ok || !r.admin){ toast('Invalid admin credentials', true); break; }
      go('/admin'); break; }
    case 'profile': {
      const cu = currentUser(); if(!cu) break;
      if (d.phone && !validPhone(d.phone)){ toast('Enter a valid 10-digit mobile', true); break; }
      cu.name = d.name; cu.phone = d.phone; saveDB(); toast('Profile updated'); render(); break; }
    case 'verify': {
      const cu = currentUser(); if(!cu) break;
      if (d.code === cu.verifyCode){ cu.verified = true; delete cu.verifyCode; saveDB(); toast('Email verified ✓'); render(); }
      else toast('Incorrect code — check the simulated email', true);
      break; }
    case 'password': {
      const cu = currentUser(); if(!cu) break;
      if (await sha256(d.cur) !== cu.passHash){ toast('Current password is incorrect', true); break; }
      if ((d.next||'').length<8){ toast('New password must be 8+ characters', true); break; }
      cu.passHash = await sha256(d.next); saveDB(); toast('Password updated'); break; }
    case 'addr': {
      const cu = currentUser(); if(!cu) break;
      if (!cu.addresses) cu.addresses=[];
      const payload = { label:d.label||'Home', line1:d.line1, area:d.area, city:d.city, state:d.state, pin:d.pin, country:'India' };
      if (!validPin(d.pin)){ toast('Enter a valid PIN', true); break; }
      const id = f.dataset.id;
      if (id){ const ex = cu.addresses.find(x=>x.id===id); Object.assign(ex, payload); }
      else cu.addresses.push({ id:uid('adr'), ...payload });
      saveDB(); closeModal(); toast('Address saved'); render(); break; }
    case 'forgot': {
      if (!validEmail(d.email)){ toast('Enter a valid email', true); break; }
      DB.emails.unshift({ id:uid('em'), kind:'reset', to:d.email, subject:'THE VERVE — Reset your password', html:'<p>A password reset link would be emailed here (demo). Production uses signed, expiring tokens.</p>', at:new Date().toISOString() });
      saveDB(); closeModal(); toast('Reset link sent (see Admin → Marketing → Email log)'); break; }
    /* -------- admin forms -------- */
    case 'adm-search': e.preventDefault(); go('/admin/'+(CURRENT_ROUTE.params[0]||'dashboard')+'?q='+encodeURIComponent(d.q||'')); break;
    case 'adm-product': {
      const isNew = f.dataset.pid==='new';
      const colors = d.colors.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{ const [n,h]=s.split(':'); return { name:(n||'').trim(), hex:(h||'#999').trim() }; });
      const sizes = d.sizes.split(',').map(s=>s.trim()).filter(Boolean);
      const tags = ['new','featured','bestseller','limited'].filter(t=>d['tag-'+t]);
      const images = (ADM.pfImages||[]).filter(Boolean);
      const published = document.getElementById('pf-pub').classList.contains('on');
      if (!colors.length || !sizes.length){ toast('Add at least one colour and size', true); break; }
      let p;
      if (isNew){
        p = { id:uid('p'), slug:(d.name||'product').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,5), sku:d.sku||('TV-CUS-'+Math.floor(Math.random()*900+100)), createdAt:new Date().toISOString().slice(0,10), demo:false, published };
        DB.products.push(p);
      } else {
        p = DB.products.find(x=>x.id===f.dataset.pid); if(!p){ toast('Not found', true); break; }
        p.published = published;
      }
      Object.assign(p, { name:d.name, sku:d.sku, category:d.category, fit:d.fit, gsm:+d.gsm||240, material:d.material, price:+d.price, mrp:+d.mrp, description:d.description, care:(d.care||'').split('\n').map(s=>s.trim()).filter(Boolean), colors, sizes, images: images.length?images:[''], tags });
      // inventory inputs
      f.querySelectorAll('[data-inv]').forEach(inp=>{
        const [pid,color,size] = inp.dataset.inv.split('::');
        DB.inventory[p.id+'::'+color+'::'+size] = Math.max(0, +inp.value||0);
      });
      saveDB(); ADM.pfImages = []; closeModal(); toast(isNew?'Product added':'Product updated'); go('/admin/products'); render(); break; }
    case 'adm-coupon': {
      const code = (d.code||'').toUpperCase().trim();
      if (!code){ toast('Enter a code', true); break; }
      if (DB.coupons.some(x=>x.code===code)){ toast('Coupon code already exists', true); break; }
      DB.coupons.push({ code, type:d.type, value:+d.value||0, min:+d.min||0, active:true, usageLimit:0, used:0, note:(d.type==='percent'? d.value+'% off' : d.type==='flat'? fmt(+d.value)+' off' : 'Free shipping')+' above ₹'+d.min });
      saveDB(); toast('Coupon created'); render(); break; }
    case 'adm-ann': { DB.settings.announcements.push({ id:uid('a'), text:(d.text||'').toUpperCase(), active:true }); saveDB(); toast('Announcement added'); render(); break; }
    case 'adm-hero': {
      Object.assign(DB.settings.hero, { kicker:d.kicker, line1:d.line1.toUpperCase(), line2:d.line2, sub:d.sub, cta1:d.cta1, cta2:d.cta2, image:d.image||IMG.hero });
      saveDB(); toast('Hero updated — open the storefront to see it'); break; }
    case 'adm-social': { DB.settings.social.instagram = d.instagram; DB.settings.social.whatsapp = (d.whatsapp||'').replace(/\D/g,''); VERVE_CONFIG.contact.email = d.email; saveDB(); toast('Saved — WhatsApp number stored permanently'); break; }
    case 'adm-integrations': {
      DB.settings.integrations = { sheetsWebhook:(d.sheetsWebhook||'').trim(), supabaseUrl:(d.supabaseUrl||'').trim(), supabaseKey:(d.supabaseKey||'').trim() };
      saveDB();
      toast('Integrations saved'+(DB.settings.integrations.supabaseUrl?' — connecting live sync…':''));
      if (DB.settings.integrations.supabaseUrl && DB.settings.integrations.supabaseKey) sbSubscribe();
      break; }
    case 'adm-page': {
      DB.settings.pages[f.dataset.slug] = { title:d.title, html:d.html };
      saveDB(); toast('Page saved'); break; }
    case 'adm-shipping': { Object.assign(DB.settings.shipping, { freeAbove:+d.freeAbove||1999, flat:+d.flat||99, codFee:+d.codFee||49 }); saveDB(); toast('Shipping rules saved'); break; }
  }
});

/* ---------- per-page binding ---------- */
function bindPage(parsed){
  buildAnnouncement();
  // transparent header over home hero
  const header = document.getElementById('site-header');
  if (header && parsed.route.page==='home'){
    header.classList.add('transparent');
    const ann = document.getElementById('announce');
    const onScroll = ()=>{
      header.classList.toggle('solidify', window.scrollY>60);
      header.style.top = header.classList.contains('solidify') ? '0px' : (ann? ann.offsetHeight:0)+'px';
    };
    window.removeEventListener('scroll', window.__hdrScroll||(()=>{}));
    window.__hdrScroll = onScroll;
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll, {passive:true});
    onScroll();
  }
  if (parsed.route.page==='product') pdRefresh();
}

/* ---------- boot ---------- */
(async function boot(){
  await loadDB();
  initAnalytics();
  window.addEventListener('hashchange', render);
  await render();
  if (sbCfg().supabaseUrl) sbSubscribe();   // live sync with other devices (if configured)
})();
</script>
